name: Update points.json
on:
  schedule:
    - cron: "17 */3 * * *"   # раз в 3 часа
  workflow_dispatch:
    inputs:
      full:
        description: "Игнорировать кеш и перекачать всё"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: points
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-points.mjs
        env:
          FULL: ${{ inputs.full && '1' || '' }}
      - name: Commit points.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add points.json cache.json top.json players.json
          git diff --cached --quiet || (git commit -m "Update points.json" && git push)
