name: most-waiting

on:
  workflow_dispatch:
    inputs:
      min_place:
        description: "Нижняя граница placement (если max пустой — это N и ниже, т.е. N+)"
        required: false
        default: "1"
      max_place:
        description: "Верхняя граница placement (включительно), можно оставить пустым"
        required: false
        default: ""
      status:
        description: "Статус рекордов"
        required: false
        default: "waiting"
        type: choice
        options: [waiting, accepted, rejected]
      min_scan:
        description: "Не останавливать перебор раньше этого user_id"
        required: false
        default: "50000"
      stop_after:
        description: "Сколько пустых id подряд = конец"
        required: false
        default: "100"
      start:
        description: "С какого user_id начать"
        required: false
        default: "1"
      workers:
        description: "Параллельных запросов"
        required: false
        default: "16"
      top:
        description: "Оставить только N лучших игроков (0 = все)"
        required: false
        default: "0"
      base_url:
        description: "База API (пусто = https://api.demonlist.org)"
        required: false
        default: ""
      commit_result:
        description: "Закоммитить результат в репозиторий (папка results/)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # лимит GitHub на джобу — 360 минут
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scripts/most-waiting.py
        env:
          MIN_PLACE: ${{ inputs.min_place }}
          MAX_PLACE: ${{ inputs.max_place }}
          STATUS: ${{ inputs.status }}
          MIN_SCAN: ${{ inputs.min_scan }}
          STOP_AFTER: ${{ inputs.stop_after }}
          START: ${{ inputs.start }}
          WORKERS: ${{ inputs.workers }}
          TOP: ${{ inputs.top }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          mkdir -p results
          NAME="most-waiting_${STATUS}_top${MIN_PLACE}${MAX_PLACE:+-$MAX_PLACE}${MAX_PLACE:-+}"
          ARGS=("$MIN_PLACE")
          if [ -n "$MAX_PLACE" ]; then ARGS+=("$MAX_PLACE"); fi
          ARGS+=(--status "$STATUS" --min-scan "$MIN_SCAN" --stop-after "$STOP_AFTER"
                 --start "$START" --workers "$WORKERS" --out "results/$NAME")
          if [ "$TOP" != "0" ]; then ARGS+=(--top "$TOP"); fi
          if [ -n "$BASE_URL" ]; then ARGS+=(--base-url "$BASE_URL"); fi
          echo "python scripts/most-waiting.py ${ARGS[*]}"
          python -u scripts/most-waiting.py "${ARGS[@]}"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: most-waiting
          path: results/
          if-no-files-found: error

      - name: Commit result
        if: ${{ inputs.commit_result }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "most-waiting: update results"
          git pull --rebase
          git push
