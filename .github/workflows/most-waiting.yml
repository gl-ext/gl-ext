name: most-waiting

on:
  schedule:
    - cron: "41 */3 * * *"      # каждые 3 часа (в 00:41, 03:41, ... по UTC)
  workflow_dispatch:
    inputs:
      min_place:
        description: "Нижняя граница placement (если max пустой — это N и ниже, т.е. N+)"
        required: false
        default: "1"
      max_place:
        description: "Верхняя граница placement (включительно), можно оставить пустым"
        required: false
        default: ""
      status:
        description: "Статус рекордов"
        required: false
        default: "waiting"
        type: choice
        options: [waiting, accepted, rejected]
      min_scan:
        description: "Не останавливать перебор раньше этого user_id"
        required: false
        default: "50000"
      stop_after:
        description: "Сколько пустых id подряд = конец"
        required: false
        default: "100"
      start:
        description: "С какого user_id начать"
        required: false
        default: "1"
      end:
        description: "На каком user_id закончить (включительно, 0 = без ограничения)"
        required: false
        default: "0"
      workers:
        description: "Параллельных запросов"
        required: false
        default: "16"
      min_count:
        description: "Выводить только игроков с N и более рекордами (1 = все)"
        required: false
        default: "1"
      top:
        description: "Оставить только N лучших игроков (0 = все)"
        required: false
        default: "0"
      base_url:
        description: "База API (пусто = https://api.demonlist.org)"
        required: false
        default: ""
      commit_result:
        description: "Закоммитить результат в репозиторий (папка results/)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Если прошлый запуск ещё идёт, новый ждёт своей очереди, а не мешает ему
concurrency:
  group: most-waiting
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350        # лимит GitHub на джобу — 360 минут
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scripts/most-waiting.py
        env:
          MIN_PLACE: ${{ inputs.min_place || '1' }}
          MAX_PLACE: ${{ inputs.max_place || '' }}
          STATUS: ${{ inputs.status || 'waiting' }}
          MIN_SCAN: ${{ inputs.min_scan || '50000' }}
          STOP_AFTER: ${{ inputs.stop_after || '100' }}
          START: ${{ inputs.start || '1' }}
          END: ${{ inputs.end || '0' }}
          WORKERS: ${{ inputs.workers || '16' }}
          TOP: ${{ inputs.top || '0' }}
          MIN_COUNT: ${{ inputs.min_count || '1' }}
          BASE_URL: ${{ inputs.base_url || '' }}
        run: |
          mkdir -p results
          if [ -n "$MAX_PLACE" ]; then RANGE="top${MIN_PLACE}-${MAX_PLACE}"; else RANGE="top${MIN_PLACE}+"; fi
          NAME="most-waiting_${STATUS}_${RANGE}"
          # если задан диапазон id — добавляем его в имя, чтобы тестовый прогон не затирал полный
          if [ "$END" != "0" ]; then NAME="${NAME}_id${START}-${END}"; elif [ "$START" != "1" ]; then NAME="${NAME}_id${START}+"; fi
          if [ "$MIN_COUNT" != "1" ]; then NAME="${NAME}_min${MIN_COUNT}"; fi
          ARGS=("$MIN_PLACE")
          if [ -n "$MAX_PLACE" ]; then ARGS+=("$MAX_PLACE"); fi
          ARGS+=(--status "$STATUS" --min-scan "$MIN_SCAN" --stop-after "$STOP_AFTER"
                 --start "$START" --end "$END" --workers "$WORKERS" --out "results/$NAME")
          if [ "$MIN_COUNT" != "1" ]; then ARGS+=(--min-count "$MIN_COUNT"); fi
          if [ "$TOP" != "0" ]; then ARGS+=(--top "$TOP"); fi
          if [ -n "$BASE_URL" ]; then ARGS+=(--base-url "$BASE_URL"); fi
          echo "python scripts/most-waiting.py ${ARGS[*]}"
          python -u scripts/most-waiting.py "${ARGS[@]}"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: most-waiting
          path: results/
          if-no-files-found: error

      - name: Commit result
        if: ${{ github.event_name == 'schedule' || inputs.commit_result }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/
          git diff --cached --quiet || git commit -m "most-waiting: update results"
          # до 5 попыток: если рядом закоммитил другой запуск — подтягиваем его изменения.
          # -X theirs: при конфликте одинаковых файлов побеждает НАШ свежий результат
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "Не удалось запушить результат" && exit 1
